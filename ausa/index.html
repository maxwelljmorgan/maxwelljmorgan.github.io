<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AUSA Walk">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f3864">
  <title>AUSA Floor Walk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============================ LOCK ============================ -->
<section id="lock" class="lock">
  <div class="lock-card">
    <img src="icon.svg" alt="" class="lock-icon">
    <h1>AUSA 2026 Floor Walk</h1>
    <p>Exhibitors, route and correspondence are encrypted. Enter the passphrase to unlock on this device.</p>
    <form id="lockForm" autocomplete="off">
      <input id="pass" type="password" placeholder="Passphrase" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
      <button type="submit" id="unlockBtn">Unlock</button>
      <p id="lockErr" class="lock-err" role="alert"></p>
    </form>
  </div>
</section>

<!-- ============================ APP ============================ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" class="search-ic" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <input id="q" type="search" placeholder="Company, booth, contact or keyword" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
      <button id="qClear" class="q-clear hidden" aria-label="Clear search">&times;</button>
    </div>
    <div id="chips" class="chips" role="tablist"></div>
  </header>

  <main>
    <section id="view-search" class="view"></section>
    <section id="view-route" class="view hidden"></section>
    <section id="view-dir" class="view hidden"></section>
    <section id="view-map" class="view hidden"></section>
    <section id="view-mail" class="view hidden"></section>
  </main>

  <nav class="tabs">
    <button data-view="search" class="on"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>My list</button>
    <button data-view="route"><svg viewBox="0 0 24 24"><path d="M6 3a3 3 0 0 1 1 5.83V11h7a4 4 0 0 1 4 4v.17A3 3 0 1 1 16 15a2 2 0 0 0-2-2H7v2.17A3 3 0 1 1 5 15.17V8.83A3 3 0 0 1 6 3z"/></svg>Route</button>
    <button data-view="dir"><svg viewBox="0 0 24 24"><path d="M4 3h13a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3V3zm2 2v13a1 1 0 0 0 1 1h11V6a1 1 0 0 0-1-1H6zm2 3h8v2H8V8zm0 4h8v2H8v-2z"/></svg>Directory</button>
    <button data-view="map"><svg viewBox="0 0 24 24"><path d="M15 4.5 9 2 3 4.5v17.5l6-2.5 6 2.5 6-2.5V2l-6 2.5zM10 4.3l4 1.7v13.7l-4-1.7V4.3zM5 5.8l3-1.3v13.7l-3 1.3V5.8zm14 12.4-3 1.3V5.8l3-1.3v13.7z"/></svg>Map</button>
    <button data-view="mail"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.6-8-5.6zM5.6 7l6.4 4.5L18.4 7H5.6z"/></svg>Emails</button>
  </nav>
</div>

<!-- ============================ SHEET (detail) ============================ -->
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-bar">
    <button id="sheetBack" class="back" aria-label="Back">&#8249; Back</button>
    <span id="sheetTitle" class="sheet-title"></span>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</div>

<script src="app.js"></script>
</body>
</html>
