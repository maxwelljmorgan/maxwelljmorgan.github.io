<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Stride</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #0b1020; color: #e8edf7; display: grid; place-items: center;
               min-height: 100vh; margin: 0; text-align: center; }
        .card { background: #131c33; border: 1px solid #243150; border-radius: 18px;
                padding: 36px 40px; box-shadow: 0 8px 30px rgba(0,0,0,.35); max-width: 420px; }
        h1 { margin: 0 0 6px; font-size: 24px; }
        p { color: #aab4cb; font-size: 14px; margin: 0 0 22px; }
        a.btn { display: inline-block; background: #38bdf8; color: #08121f; text-decoration: none;
                font-weight: 700; padding: 13px 26px; border-radius: 12px; font-size: 16px; }
        a.btn:hover { filter: brightness(1.05); }
        .mark { font-size: 40px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">🏃</div>
        <h1>Stride</h1>
        <p>Running Training Tracker</p>
        <!-- Opens the app in a new tab (your default browser, e.g. Google Chrome) -->
        <a class="btn" href="running/index.html" target="_blank" rel="noopener">Open Stride →</a>
    </div>
</body>
</html>
